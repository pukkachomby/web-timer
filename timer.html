<!DOCTYPE html>
<html>
<head>
    <title>Auto-Reset Countdown</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #121212; 
            color: #fff; 
        }
        #timer { 
            font-size: 8rem; 
            font-family: monospace; 
            margin-bottom: 1rem;
        }
        #counter {
            font-size: 1.8rem;
            color: #1a73e8;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        #status {
            font-size: 1.5rem;
            height: 2rem;
            color: #1a73e8;
            margin-bottom: 1rem;
        }
        .controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }
        button {
            width: 110px;
            height: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #333;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover {
            background: #555;
        }
        .time-btn {
            background: #1a73e8;
        }
        .time-btn:hover {
            background: #1557b0;
        }
        #resetBtn {
            background: #c62828;
        }
        #resetBtn:hover {
            background: #d32f2f;
        }
    </style>
</head>
<body>
    <div id="status"></div>
    <div id="timer">01:00</div>
    <div id="counter">Set: 1</div>

    <div class="controls">
        <button class="time-btn" onclick="startWithCountdown(60)">1 MIN</button>
        <button class="time-btn" onclick="startWithCountdown(90)">1.5 MIN</button>
        <button class="time-btn" onclick="startWithCountdown(120)">2 MIN</button>
        <button class="time-btn" onclick="startWithCountdown(150)">2.5 MIN</button>
        <button class="time-btn" onclick="startWithCountdown(600)">10 MIN</button>
        <button id="resetBtn" onclick="resetTimer()">RESET</button>
    </div>

    <script>
        const prepSeconds = 5;

        let activeWorkoutSeconds = 60;
        let secondsLeft = activeWorkoutSeconds;
        let timerInterval = null;
        let isPrep = false;
        let iterations = 1;

        function updateDisplay(secs) {
            const mins = String(Math.floor(secs / 60)).padStart(2, '0');
            const remainingSecs = String(secs % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${mins}:${remainingSecs}`;
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function updateCounterDisplay() {
            document.getElementById('counter').textContent = `Set: ${iterations}`;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isPrep = false;
            iterations = 1;
            secondsLeft = activeWorkoutSeconds;
            updateDisplay(secondsLeft);
            updateCounterDisplay();
            setStatus('');
        }

        function startWithCountdown(selectedSeconds) {
            if (timerInterval) clearInterval(timerInterval);

            activeWorkoutSeconds = selectedSeconds;
            isPrep = true;
            secondsLeft = prepSeconds;
            setStatus('GET READY...');
            updateDisplay(secondsLeft);

            timerInterval = setInterval(() => {
                secondsLeft--;

                if (isPrep) {
                    if (secondsLeft < 0) {
                        isPrep = false;
                        secondsLeft = activeWorkoutSeconds;
                        setStatus('WORK');
                        updateDisplay(secondsLeft);
                    } else {
                        updateDisplay(secondsLeft);
                    }
                } else {
                    if (secondsLeft < 0) {
                        iterations++;
                        updateCounterDisplay();
                        secondsLeft = activeWorkoutSeconds;
                    }
                    updateDisplay(secondsLeft);
                }
            }, 1000);
        }

        updateDisplay(activeWorkoutSeconds);
        updateCounterDisplay();
    </script>
</body>
</html>
